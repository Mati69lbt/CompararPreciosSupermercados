<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- Degradado principal del proyecto -->
    <linearGradient id="mercadoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" /> <!-- Azul -->
      <stop offset="50%" stop-color="#06B6D4" /> <!-- Turquesa / Río -->
      <stop offset="100%" stop-color="#10B981" /> <!-- Verde -->
    </linearGradient>
  </defs>

  <!-- Fondo circular con degradado -->
  <circle cx="32" cy="32" r="30" fill="url(#mercadoGrad)" />

  <!-- Changuito / Ahorro en blanco -->
  <path fill="#FFFFFF" d="M18 16h4l3.6 18H44l4-12H26.5" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="28" cy="42" r="3.5" fill="#FFFFFF" />
  <circle cx="41" cy="42" r="3.5" fill="#FFFFFF" />
  
  <!-- Detalle sutil de ola (Identidad Paraná / Santa Fe) -->
  <path d="M14 50 Q 24 46, 32 50 T 50 50" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.6" stroke-linecap="round" />
</svg>
